name: Build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"
      - name: Publish single-file exe
        run: dotnet publish src/AndroidTVDebloater -c Release -r win-x64 -o publish
      - uses: actions/upload-artifact@v4
        with:
          name: AndroidTVDebloater
          path: publish/AndroidTVDebloater.exe
      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: publish/AndroidTVDebloater.exe
