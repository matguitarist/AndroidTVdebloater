name: Build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"
      - name: Publish single-file exe
        run: dotnet publish src/AndroidTVDebloater -c Release -r win-x64 -o publish
      - uses: actions/upload-artifact@v4
        with:
          name: AndroidTVDebloater
          path: publish/AndroidTVDebloater.exe
      # The annotated tag's message becomes the release notes, which the app's update dialog shows.
      - name: Release notes from the tag message
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          git fetch --force origin "refs/tags/${GITHUB_REF_NAME}:refs/tags/${GITHUB_REF_NAME}"
          git tag -l --format='%(contents:body)' "${GITHUB_REF_NAME}" > notes.md
      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: publish/AndroidTVDebloater.exe
          body_path: notes.md

  # The in-place update (rename the running exe, move the new one in) only works on Windows.
  update-swap-test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"
      - name: Publish test exe
        run: dotnet publish tools/UpdateSwapTest -c Release -r win-x64 -o swaptest
      - name: Update itself from the latest release
        run: .\swaptest\UpdateSwapTest.exe
      - name: Close the copy the update started
        if: always()
        run: Stop-Process -Name UpdateSwapTest -ErrorAction SilentlyContinue
